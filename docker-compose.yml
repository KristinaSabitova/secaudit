services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secaudit
      POSTGRES_DB: secaudit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secaudit -d secaudit"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    container_name: secaudit-app
    environment:
      DATABASE_URL: postgresql+psycopg://secaudit:${POSTGRES_PASSWORD}@db:5432/secaudit
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in .env}
      # Encrypts the API key entered in the dashboard. Rotating it makes the
      # stored key unreadable, which the settings panel reports.
      SECAUDIT_SECRET_KEY: ${SECAUDIT_SECRET_KEY:?set SECAUDIT_SECRET_KEY in .env}
      # Sign-in with GitHub. Without these the dashboard has no way in.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      SECAUDIT_PUBLIC_URL: ${SECAUDIT_PUBLIC_URL:-}
      SECAUDIT_ADMIN_GITHUB_LOGIN: ${SECAUDIT_ADMIN_GITHUB_LOGIN:-}
      SECAUDIT_ALLOWED_GITHUB_LOGINS: ${SECAUDIT_ALLOWED_GITHUB_LOGINS:-}
      # Any engine backend works; pick one in .env. Credentials are not required
      # to boot — /api/health reports an unusable backend instead of crashing.
      SECAUDIT_BACKEND: ${SECAUDIT_BACKEND:-anthropic-api}
      SECAUDIT_MODEL: ${SECAUDIT_MODEL:-}
      SECAUDIT_OLLAMA_URL: ${SECAUDIT_OLLAMA_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SECAUDIT_TIMEOUT: ${SECAUDIT_TIMEOUT:-1800}
      # Only applies to webhook audits: dashboard audits carry their own.
      SECAUDIT_DEFAULT_LANGUAGE: ${SECAUDIT_DEFAULT_LANGUAGE:-en}
    # Lets SECAUDIT_OLLAMA_URL point at an Ollama running on the host as
    # http://host.docker.internal:11434.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Loopback only, and only so 'deploy.sh --tunnel' can forward the dashboard
    # over SSH. The reverse proxy does not use this port: it is a container on
    # PROXY_NETWORK and reaches the app directly as http://secaudit-app:8000.
    ports:
      - "127.0.0.1:${SECAUDIT_PORT:-8811}:8000"
    networks:
      - default
      - proxy
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  # The network the existing reverse proxy already runs on. Created by that
  # stack, joined here; compose must not try to manage it.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-spectra_default}

volumes:
  pgdata:
